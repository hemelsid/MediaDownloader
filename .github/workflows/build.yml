name: Build APK

# Builds the Android APKs and the Windows app, then publishes ONE release (v1.<run>) with all files.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', '.github/workflows/legacy-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APKs
        env:
          KEYSTORE_PASSWORD: mediadownloader
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
      - name: Collect APKs
        run: |
          mkdir out
          for f in app/build/outputs/apk/release/*.apk; do
            n=$(basename "$f"); abi=${n#app-}; abi=${abi%-release.apk}
            cp "$f" "out/VideoDownloader-${abi}.apk"
          done
          ls -lh out
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/*.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build tools
        run: python -m pip install pyinstaller pillow customtkinter==6.0.0 pystray
      - name: Version and icon
        shell: pwsh
        run: |
          "VERSION = `"1.${{ github.run_number }}`"" | Out-File -Encoding utf8 desktop/_version.py
          python desktop/icons.py desktop
      - name: Build app
        run: >
          pyinstaller --noconfirm --clean --windowed --name VideoDownloader
          --icon desktop/icon.ico --paths desktop
          --collect-data customtkinter
          --hidden-import PIL._tkinter_finder --hidden-import pystray._win32
          desktop/video_downloader.py
      - name: Add engine (yt-dlp, ffmpeg, Deno)
        shell: pwsh
        run: |
          $app = "dist/VideoDownloader"
          Copy-Item desktop/icon.png, desktop/icon.ico $app/
          Copy-Item -Recurse browser-extension "$app/extension"
          $bin = New-Item -ItemType Directory -Force "$app/bin"
          Invoke-WebRequest https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe -OutFile "$bin/yt-dlp.exe"
          Invoke-WebRequest https://github.com/yt-dlp/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip -OutFile ff.zip
          Expand-Archive ff.zip ff
          Get-ChildItem ff -Recurse -Include ffmpeg.exe,ffprobe.exe | Copy-Item -Destination $bin
          Invoke-WebRequest https://github.com/denoland/deno/releases/latest/download/deno-x86_64-pc-windows-msvc.zip -OutFile deno.zip
          Expand-Archive deno.zip $bin
          Get-ChildItem $bin
      - name: Check engine
        shell: pwsh
        run: |
          $bin = "dist/VideoDownloader/bin"
          & "$bin/yt-dlp.exe" --version
          & "$bin/ffmpeg.exe" -version | Select-Object -First 1
          & "$bin/deno.exe" --version
      - name: Smoke test (app starts and closes)
        shell: pwsh
        run: |
          $p = Start-Process dist/VideoDownloader/VideoDownloader.exe -ArgumentList "--selftest" -PassThru
          if (-not $p.WaitForExit(60000)) { $p.Kill(); throw "App did not close by itself" }
          "exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { throw "App crashed on start" }
      - name: Real download test (information only)
        continue-on-error: true
        shell: pwsh
        run: |
          Copy-Item -Recurse dist/VideoDownloader/bin desktop/bin
          python -c "import sys; sys.path.insert(0,'desktop'); import engine; e=engine.Engine({}); i=e.info('https://www.youtube.com/watch?v=jNQXAC9IVRw'); print('YouTube OK:', i.title, [q.label for q in i.video][:4])"
      - name: Installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress | Out-Null
          $iscc = Get-ChildItem "C:\Program Files*\Inno Setup*\ISCC.exe" | Select-Object -First 1
          & $iscc.FullName "/DAppVersion=1.${{ github.run_number }}" desktop/installer.iss
          Compress-Archive dist/VideoDownloader/* out/VideoDownloader-Windows-portable.zip
          Compress-Archive browser-extension/* out/VideoDownloader-Browser-Extension.zip
          Get-ChildItem out
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/*

  release:
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - run: ls -lh out
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Video Downloader v1.${{ github.run_number }}
          make_latest: true
          files: out/*
          body: |
            ### 📱 Phone (Android)
            - `VideoDownloader-arm64-v8a.apk` — almost every phone from 2017 onwards ✅
            - `VideoDownloader-armeabi-v7a.apk` — very old or low-end phones
            - `VideoDownloader-x86_64.apk` — emulators / Chromebooks

            ### 💻 PC (Windows 10/11, 64-bit)
            - `VideoDownloader-Windows-Setup.exe` — installer (no admin needed, adds a desktop shortcut) ✅
            - `VideoDownloader-Windows-portable.zip` — no install: unzip and run `VideoDownloader.exe`
            - `VideoDownloader-Browser-Extension.zip` — the "Download this video" button for Chrome / Edge / Brave
              (already included in the PC app — in the app click **Browser button** for the 1-minute setup)

            New versions install over the old one. Every older version stays below in Releases.
