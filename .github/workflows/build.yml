name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APKs
        env:
          KEYSTORE_PASSWORD: mediadownloader
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Collect APKs
        run: |
          mkdir out
          for f in app/build/outputs/apk/release/*.apk; do
            n=$(basename "$f"); abi=${n#app-}; abi=${abi%-release.apk}
            cp "$f" "out/VideoDownloader-${abi}.apk"
          done
          ls -lh out

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Video Downloader v1.${{ github.run_number }}
          make_latest: true
          files: out/*.apk
          body: |
            **Which APK should I download?**
            - `VideoDownloader-arm64-v8a.apk` — almost every phone from 2017 onwards ✅
            - `VideoDownloader-armeabi-v7a.apk` — very old or low-end phones
            - `VideoDownloader-x86_64.apk` — emulators / Chromebooks

            New versions install over the old one — no need to uninstall.
