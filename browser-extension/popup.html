<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body{margin:0;width:300px;background:#18181B;color:#F4F4F5;font:13px/1.45 "Segoe UI",system-ui,sans-serif}
  .head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid #2C2C32}
  .head img{width:28px;height:28px}
  .head b{font-size:15px}
  .body{padding:12px 16px 16px}
  .status{display:flex;align-items:center;gap:8px;margin-bottom:10px}
  .dot{width:9px;height:9px;border-radius:50%;background:#71717A}
  .ok .dot{background:#34D399} .bad .dot{background:#F87171}
  button{width:100%;margin-top:6px;padding:9px;border:0;border-radius:9px;background:#FF6A13;color:#fff;
         font:600 13px "Segoe UI",system-ui,sans-serif;cursor:pointer}
  button:hover{background:#E85D0C}
  button.ghost{background:#26262B;color:#F4F4F5}
  p{color:#A1A1AA;margin:8px 0 0}
</style>
</head>
<body>
  <div class="head"><img src="icons/icon48.png" alt=""><b>Video Downloader</b></div>
  <div class="body">
    <div class="status" id="status"><span class="dot"></span><span id="statusText">Checking the app…</span></div>
    <button id="send">Download this page's video</button>
    <p>Tip: play a video — an orange <b>Download this video</b> button appears on it. You can also right-click a
      page or link and choose <b>Download with Video Downloader</b>.</p>
  </div>
  <script src="popup.js"></script>
</body>
</html>
